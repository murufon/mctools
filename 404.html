<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Minecraft 装置勢向けの計算ツール集。ガーディアン湧き座標、湧き範囲、落下ダメージなどをブラウザで即座に計算。" />
    <title>MC Tools - Minecraft 装置勢ツール集</title>
    <script>
      // GitHub Pages SPA redirect
      // 404.html -> index.html with the same path
      var pathSegmentsToKeep = 1; // '/mctools/' = 1 segment
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
